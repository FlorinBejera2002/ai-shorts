name: sneepcut-production

x-environment: &environment
  APP_ENV: production
  APP_URL: https://sneepcut.com
  DATABASE_URL: postgresql://${POSTGRES_USER:-sneepcut}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sneepcut}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
  UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET:?Set UPLOAD_TOKEN_SECRET}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  STORAGE_TYPE: local
  LOCAL_MEDIA_ROOT: /app/media
  CORS_ORIGINS: https://sneepcut.com,https://www.sneepcut.com
  UPLOAD_SCANNER_ENABLED: "true"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

x-app: &app
  env_file: ${PRODUCTION_ENV_FILE:-.env.production.local}
  environment: *environment
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sneepcut}
      POSTGRES_DB: ${POSTGRES_DB:-sneepcut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  migrate:
    <<: *app
    build:
      context: ./backend
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    build: ./backend
    networks: [default, studio]
    environment:
      <<: *environment
      GO_AUTH_ENABLED: "true"
      LISTEN_ADDR: ":8080"
      ALLOWED_HOSTS: api.sneepcut.com,sneepcut.com,www.sneepcut.com,localhost,127.0.0.1,backend
      TRUSTED_PROXY_CIDRS: 172.30.94.253/32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    volumes: ["media_data:/app/media"]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    read_only: true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    build:
      context: ./backend
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ['media_data:/app/media']
    tmpfs: ['/tmp:uid=10001,gid=10001,mode=1770']
    read_only: true
    user: '10001:10001'
    init: true
    stop_grace_period: 5m

  studio:
    build:
      context: ./editor
      dockerfile: Dockerfile.sneepcut
    image: sneepcut-production-studio
    environment:
      NODE_ENV: production
      SNEEPCUT_STUDIO_HOST: 0.0.0.0
      SNEEPCUT_STUDIO_PORT: "5191"
      SNEEPCUT_STUDIO_ORIGIN: https://studio.sneepcut.com
      SNEEPCUT_APP_ORIGIN: https://sneepcut.com
      SNEEPCUT_APP_ADDITIONAL_ORIGINS: https://www.sneepcut.com
      SNEEPCUT_AUTH_BASE_URL: http://backend:8080
      SNEEPCUT_MEDIA_ORIGIN: https://sneepcut.com
      SNEEPCUT_STUDIO_DATA: /data/projects
      SNEEPCUT_REGISTRY_DIR: /app/registry
      SNEEPCUT_AI_BASE_URL: ${SNEEPCUT_AI_BASE_URL:-}
      SNEEPCUT_AI_MODEL: ${SNEEPCUT_AI_MODEL:-}
      SNEEPCUT_AI_API_KEY: ${SNEEPCUT_AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-google/gemini-2.5-flash}
      PRODUCER_HEADLESS_SHELL_PATH: /usr/bin/chromium
      HYPERFRAMES_NO_TELEMETRY: "1"
      HOME: /tmp/studio-home
    volumes: ["studio_data:/data"]
    tmpfs: ["/tmp:size=3g,uid=1000,gid=1000,mode=1770"]
    shm_size: 1gb
    read_only: true
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      # Bubblewrap creates a nested unprivileged mount/user namespace per job.
      - seccomp=./deploy/studio-seccomp.json
      - apparmor=unconfined
      - systempaths=unconfined
    networks: [studio]
    init: true
    restart: unless-stopped
    pids_limit: 512
    mem_limit: 6g
    cpus: 2
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5191/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_URL: https://sneepcut.com
        VITE_STUDIO_URL: https://studio.sneepcut.com
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-admin@sneepcut.com}
    image: sneepcut-production-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:stable-alpine
    # Match Go's media ownership while keeping the media mount read-only.
    user: "10001:10001"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
    networks:
      default:
        ipv4_address: 172.30.94.253
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.94.254
      studio: {}
    depends_on: [nginx]
    restart: unless-stopped

networks:
  studio: {}
  default:
    ipam:
      config:
        - subnet: 172.30.94.0/24

volumes:
  studio_data:
  postgres_data:
  redis_data:
  media_data:
  clamav_data:
  caddy_data:
  caddy_config:
