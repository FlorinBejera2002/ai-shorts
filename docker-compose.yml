services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Defaults preserve existing volumes. New installations set the
      # Sneepcut values included in .env.example.
      POSTGRES_DB: ${POSTGRES_DB:-sneepcut}
      POSTGRES_USER: ${POSTGRES_USER:-sneepcut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    volumes:
      - clamav_data:/var/lib/clamav
      - ./backend/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    expose:
      - "3310"
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: api
    image: sneepcut-api
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-go:
    profiles: ["go-api"]
    build: ./backend-go
    env_file: .env
    environment:
      PYTHON_BACKEND_URL: http://backend:8000
      LISTEN_ADDR: ":8080"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/app/media:ro
    expose:
      - "8080"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: ml
    image: sneepcut-ml
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: ${WORKER_MEMORY_LIMIT:-6g}
    cpus: ${WORKER_CPU_LIMIT:-2}
    command: >
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=${WORKER_MAX_TASKS_PER_CHILD:-50}
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  job-dispatcher:
    image: sneepcut-api
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    command: python -m app.services.job_delivery
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_data:
  clamav_data:
