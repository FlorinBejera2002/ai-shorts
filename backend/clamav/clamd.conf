# Private network only; never publish this unauthenticated protocol publicly.
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
LogFile /tmp/clamd.log
PidFile /tmp/clamd.pid
MaxThreads 2
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 500
StreamMaxLength 2048M
MaxFileSize 2048M
MaxScanSize 4096M
MaxScanTime 90000
# Essential: a limit-exceeded scan must not masquerade as a clean file.
AlertExceedsMax yes
AlertEncrypted yes
