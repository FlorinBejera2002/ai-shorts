# Static export of the public site (landing, pricing, legal, 404).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain application/xml application/json;

    error_page 404 /404.html;

    # Clean URLs only: /pricing, never /pricing.html or /pricing/.
    rewrite ^(/.+)/$ $1 permanent;
    location = /index.html { return 301 /; }
    location ~ ^(?<clean>/.+)\.html$ { return 301 $clean; }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location = /ro/404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location = /es/404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /landing/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /ro/404 {
        error_page 404 /ro/404.html;
        return 404;
    }

    location /ro/ {
        error_page 404 /ro/404.html;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /es/404 {
        error_page 404 /es/404.html;
        return 404;
    }

    location /es/ {
        error_page 404 /es/404.html;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
