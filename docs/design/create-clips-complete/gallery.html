<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sneep Cut — Create clips, desktop și mobil</title>
<style>
:root{color-scheme:dark;--radius-md:6px;--radius-sm:4px;font:15px/1.5 system-ui,sans-serif;background:#0b0e11;color:#f6f6f6}
*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #293038;padding:28px max(24px,calc((100vw - 1440px)/2));background:#0e1216}h1{font-size:28px;letter-spacing:-.04em;margin:4px 0 8px}p{color:#aab2bb;margin:0}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase}a{color:inherit}main{max-width:1488px;margin:auto;padding:24px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}.tools label{display:flex;align-items:center;gap:8px}input,select,button{font:inherit;color:inherit;background:#12181e;border:1px solid #303943;border-radius:var(--radius-md);padding:9px 12px}input{min-width:240px}button{cursor:pointer}button:hover,select:hover{background:#202830}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}.count{margin-left:auto;align-self:center;color:#aab2bb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.pair{border:1px solid #293038;border-radius:var(--radius-md);padding:16px;min-width:0}.pair h2{font-size:17px;letter-spacing:-.02em;margin:0 0 12px}.images{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.39fr);gap:12px;align-items:start}.preview{display:block;border:0;background:#090c0f;padding:0;width:100%;border-radius:var(--radius-md)}.preview:hover{background:#151b21}.preview img{display:block;width:100%;height:300px;object-fit:contain;border-radius:var(--radius-md)}figcaption{font-size:12px;color:#aab2bb;padding-top:8px}figure{margin:0;min-width:0}figure a{color:#b8c1ca}dialog{max-width:98vw;max-height:98vh;padding:16px;border:1px solid #3a444f;border-radius:var(--radius-md);background:#0b0e11;color:white}dialog::backdrop{background:#000c}.dialog-tools{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:12px}dialog img{display:block;max-width:92vw;max-height:84vh;object-fit:contain}.empty{padding:40px;color:#aab2bb;text-align:center}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.count{margin-left:0}.preview img{height:260px}}@media(max-width:520px){main{padding:16px}header{padding:24px 16px}.tools label{width:100%}input,select{min-width:0;flex:1}.pair{padding:12px}.preview img{height:220px}}
</style>
</head>
<body>
<header><div class="eyebrow">Sneep Cut · direcție aleasă</div><h1>Create clips</h1><p>32 de stări · desktop și mobil. Pașii de procesare păstrează componenta existentă.</p></header>
<main>
<div class="tools"><label>Caută <input id="search" type="search" placeholder="Numele ecranului"></label><label>Flux <select id="group"><option value="all">Toate</option><option value="story">Filmări / Story</option><option value="youtube">YouTube</option><option value="processing">Procesare</option></select></label><span class="count" id="count"></span></div>
<div id="grid" class="grid"></div><p id="empty" class="empty" hidden>Nu există ecrane pentru această căutare.</p>
</main>
<dialog id="zoom" aria-labelledby="zoom-title"><div class="dialog-tools"><span id="zoom-title"></span><button id="close" type="button">Închide</button></div><img id="zoom-image" alt=""></dialog>
<script>
const entries=[{"stem":"footage","label":"Filmări","group":"story"},{"stem":"projects","label":"Proiecte","group":"story"},{"stem":"uploads","label":"Încărcare în curs","group":"story"},{"stem":"upload-recovery","label":"Recuperarea încărcării","group":"story"},{"stem":"clip-preferences","label":"Preferințe sursă","group":"story"},{"stem":"story-brief","label":"Direcție video","group":"story"},{"stem":"music","label":"Muzică","group":"story"},{"stem":"narration-recording","label":"Înregistrare voce","group":"story"},{"stem":"narration-draft","label":"Înregistrare nesalvată","group":"story"},{"stem":"story-captions","label":"Subtitrări","group":"story"},{"stem":"story-format","label":"Format","group":"story"},{"stem":"story-review","label":"Verificare înainte de generare","group":"story"},{"stem":"transcript-review","label":"Revizuire transcript","group":"story"},{"stem":"audio-comparison","label":"Comparare audio","group":"story"},{"stem":"story-agent","label":"Ajutor la cerere","group":"story"},{"stem":"story-processing","label":"Procesare Story","group":"processing"},{"stem":"story-ready","label":"Rezultat gata","group":"story"},{"stem":"story-needs-review","label":"Rezultat de verificat","group":"story"},{"stem":"story-error","label":"Eroare Story","group":"story"},{"stem":"story-delete","label":"Confirmare ștergere","group":"story"},{"stem":"story-load-error","label":"Eroare încărcare Story","group":"story"},{"stem":"youtube-empty","label":"YouTube gol","group":"youtube"},{"stem":"youtube-ready","label":"YouTube pregătit","group":"youtube"},{"stem":"youtube-batch","label":"Mai multe linkuri","group":"youtube"},{"stem":"youtube-style","label":"Stil subtitrări","group":"youtube"},{"stem":"youtube-no-credits","label":"Credite insuficiente","group":"youtube"},{"stem":"youtube-advanced","label":"Opțiuni avansate","group":"youtube"},{"stem":"job-processing","label":"Procesare YouTube","group":"processing"},{"stem":"job-audio-recovery","label":"Recuperare audio","group":"processing"},{"stem":"job-failed","label":"Job eșuat","group":"processing"},{"stem":"job-completed","label":"Clipuri gata","group":"processing"},{"stem":"job-load-error","label":"Eroare încărcare job","group":"processing"}];
const grid=document.getElementById('grid');
for(const entry of entries){
 const article=document.createElement('article');article.className='pair';article.dataset.group=entry.group;article.dataset.search=entry.label.toLocaleLowerCase('ro');
 const heading=document.createElement('h2');heading.textContent=entry.label;article.append(heading);
 const images=document.createElement('div');images.className='images';
 for(const viewport of ['desktop','mobile']){
  const title=entry.label+' · '+(viewport==='desktop'?'Desktop':'Mobil');const source=viewport+'-'+entry.stem+'.png';
  const figure=document.createElement('figure');const button=document.createElement('button');button.className='preview';button.type='button';button.setAttribute('aria-label','Mărește '+title);
  const image=document.createElement('img');image.src=source;image.alt=title;image.loading='lazy';button.append(image);
  button.addEventListener('click',()=>{document.getElementById('zoom-title').textContent=title;const full=document.getElementById('zoom-image');full.src=source;full.alt=title;document.getElementById('zoom').showModal()});
  const caption=document.createElement('figcaption');const link=document.createElement('a');link.href=source;link.textContent=viewport==='desktop'?'Desktop':'Mobil';link.target='_blank';link.rel='noopener';caption.append(link);figure.append(button,caption);images.append(figure)
 }
 article.append(images);grid.append(article)
}
function filter(){const query=document.getElementById('search').value.trim().toLocaleLowerCase('ro');const group=document.getElementById('group').value;let visible=0;for(const article of grid.children){article.hidden=!(article.dataset.search.includes(query)&&(group==='all'||article.dataset.group===group));if(!article.hidden)visible++}document.getElementById('count').textContent=visible+' / 32 de stări';document.getElementById('empty').hidden=visible!==0}
document.getElementById('search').addEventListener('input',filter);document.getElementById('group').addEventListener('change',filter);document.getElementById('close').addEventListener('click',()=>document.getElementById('zoom').close());document.getElementById('zoom').addEventListener('click',event=>{if(event.target===document.getElementById('zoom'))document.getElementById('zoom').close()});filter();
</script>
</body>
</html>
