# clamd configuration for Sneep Cut. Mounted read-only over the image default.
# The base lines repeat the clamav/clamav image defaults; the limits below let
# clamd scan every video the app accepts (MAX_UPLOAD_SIZE_MB, up to 2 GB).
# Without them clamd stops a stream at 100 MB and the upload is rejected.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# ClamAV cannot scan files of 2 GB or more; the backend refuses those first.
StreamMaxLength 2047M
MaxFileSize 2047M
MaxScanSize 4000M
