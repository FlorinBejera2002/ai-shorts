worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Only Caddy can supply the client IP. It discards untrusted incoming XFF.
    set_real_ip_from 172.30.94.254;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;

    upstream backend { server backend-go:8080; keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        # Next.js proxies signed /media URLs to the internal Compose service,
        # which uses "nginx" as the upstream Host header.
        server_name api.sneepcut.com nginx;
        client_max_body_size 2G;
        limit_conn connections 40;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host api.sneepcut.com;
        proxy_set_header X-Forwarded-Host api.sneepcut.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }
        location /v1/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }
        location ^~ /media/ {
            auth_request /_media_auth;
            alias /app/media/;
            add_header Cache-Control "private, no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /_media_auth {
            internal;
            proxy_pass http://backend/api/media/verify-request;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host api.sneepcut.com;
        }
        location / { return 404; }
    }
}
