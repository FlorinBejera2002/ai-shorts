services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - media_data:/app/media
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  worker:
    volumes:
      - ./backend/app:/app/app
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      target: dev
    image: sneepcut-frontend-dev
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    environment:
      - WATCHPACK_POLLING=true
