services:
  seaweedfs:
    # Development-only S3 endpoint, in the same Compose project as the app.
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    user: "1000:1000"
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.port=${SEAWEEDFS_PORT:-8333}
      - -master.volumeSizeLimitMB=128
      - -volume.max=4
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-sneepcut-dev}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-sneepcut-local-development-only}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-sneepcut-dev}
    ports:
      - "127.0.0.1:${SEAWEEDFS_PORT:-8333}:${SEAWEEDFS_PORT:-8333}"
    networks:
      default:
        # Browsers resolve *.localhost to loopback; containers use this alias.
        aliases: ["s3.localhost"]
    volumes:
      # The image also keeps filer metadata under /data/filerldb2.
      - ${SNEEPCUT_RUNTIME_ROOT:-../ai-shorts-runtime}/seaweedfs:/data
      - ${SNEEPCUT_RUNTIME_ROOT:-../ai-shorts-runtime}/tmp/seaweedfs:/tmp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/cluster/status
          && wget -S -O /dev/null http://127.0.0.1:${SEAWEEDFS_PORT:-8333}/ 2>&1
          | grep -q 'HTTP/1.1 403 Forbidden'
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  migrate:
    build:
      context: ./backend
      target: dev
    image: sneepcut-go-dev
    command: go run ./cmd/migrate
    entrypoint: []
    read_only: false
    working_dir: /src

  backend:
    depends_on:
      seaweedfs:
        condition: service_healthy
    build:
      context: ./backend
      target: dev
    image: sneepcut-go-dev
    command: go run ./cmd/api
    entrypoint: []
    read_only: false
    user: "10001:10001"
    environment:
      GOCACHE: /src/.cache/go-build
      GOFLAGS: -p=1
      GOMAXPROCS: "2"
    volumes:
      - ${SNEEPCUT_RUNTIME_ROOT:-../ai-shorts-runtime}/cache/go-build:/src/.cache/go-build
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /src
          initial_sync: true
          ignore: [".git/", "**/*_test.go", "Dockerfile", "*.md"]
    working_dir: /src
    ports:
      - "127.0.0.1:${GO_BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      start_period: 60s
      timeout: 5s
      retries: 5

  worker:
    depends_on:
      seaweedfs:
        condition: service_healthy

  studio:
    # Keep server changes testable without rebuilding the bundled Studio UI.
    volumes:
      - ./editor/packages/sneepcut-server/src:/app/packages/sneepcut-server/src:ro
      - ./editor/packages/sneepcut-server/tsconfig.json:/app/packages/sneepcut-server/tsconfig.json:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    image: sneepcut-frontend-dev
    command: pnpm dev --host --port 80
    environment:
      VITE_DEV_API_TARGET: http://backend:8080
      VITE_DEV_MEDIA_TARGET: http://nginx:80
      VITE_USE_POLLING: "true"
      VITE_APP_URL: http://localhost:3000
      VITE_STUDIO_URL: ${VITE_STUDIO_URL:-http://localhost:5191}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
      - ${SNEEPCUT_RUNTIME_ROOT:-../ai-shorts-runtime}/cache/frontend:/app/node_modules/.vite
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:80"

  admin:
    build:
      context: ./admin
      target: dev
    image: sneepcut-admin-dev
    command: npm run dev -- --host 0.0.0.0 --port 8080
    environment:
      VITE_DEV_API_TARGET: http://backend:8080
    volumes:
      - ./admin/src:/app/src
      - ./admin/index.html:/app/index.html
      - ${SNEEPCUT_RUNTIME_ROOT:-../ai-shorts-runtime}/cache/admin:/app/node_modules/.vite
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-3002}:8080"
    read_only: false

  nginx:
    # Refresh Nginx's upstream DNS after Compose recreates an app container.
    depends_on:
      frontend:
        condition: service_started
        restart: true
      backend:
        condition: service_started
        restart: true
