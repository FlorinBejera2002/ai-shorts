services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  migrate:
    build:
      context: ./backend
      target: dev
    image: sneepcut-go-dev
    command: go run ./cmd/migrate
    entrypoint: []
    read_only: false
    working_dir: /src

  backend:
    build:
      context: ./backend
      target: dev
    image: sneepcut-go-dev
    command: go run ./cmd/api
    entrypoint: []
    read_only: false
    user: "10001:10001"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,exec
    environment:
      GOCACHE: /src/.cache/go-build
      GOFLAGS: -p=1
      GOMAXPROCS: "2"
    volumes:
      - media_data:/app/media
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /src
          initial_sync: true
          ignore: [".git/", "**/*_test.go", "Dockerfile", "*.md"]
    working_dir: /src
    ports:
      - "127.0.0.1:${GO_BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      start_period: 60s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    image: sneepcut-frontend-dev
    command: pnpm dev --host --port 80
    environment:
      VITE_DEV_API_TARGET: http://backend:8080
      VITE_DEV_MEDIA_TARGET: http://nginx:80
      VITE_USE_POLLING: "true"
      VITE_APP_URL: http://localhost:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:80"

  nginx:
    # Refresh Nginx's upstream DNS after Compose recreates an app container.
    depends_on:
      frontend:
        condition: service_started
        restart: true
      backend:
        condition: service_started
        restart: true
